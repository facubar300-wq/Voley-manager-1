name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: unzip -q voley-manager-android-source.zip

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compilar APK
        run: gradle --no-daemon -p voley-manager assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: voley-manager-debug-apk
          path: voley-manager/app/build/outputs/apk/debug/app-debug.apk
